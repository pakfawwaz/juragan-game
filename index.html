<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Juragan: an Indonesian business strategy game set from 2005 to 2024.">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Juragan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a bank passbook. Sticky clock bar, tab strip, one working column of ruled ledger panels. */
:root{
  --paper:#E8EEE9; --surface:#F7FAF6; --sunk:#DEE6E0; --ink:#17224A; --muted:#55607D;
  --line:#C2CEC5; --rule:#D5DED7; --accent:#B07400; --accent-soft:#F3E3BF; --on-accent:#FFFFFF;
  --up:#1B7146; --down:#AE2A20; --warn:#94590A; --chip:#E0E7F3;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --f-display:'Young Serif', Georgia, 'Times New Roman', serif;
  --f-body:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, Consolas, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#10151F; --surface:#171E2B; --sunk:#0D121A; --ink:#E5E9F3; --muted:#98A2BC;
  --line:#2B3448; --rule:#222A3A; --accent:#E2A93A; --accent-soft:#3A2E14; --on-accent:#17120A;
  --up:#4BC488; --down:#F0756B; --warn:#E8B04E; --chip:#222C40; color-scheme:dark;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767 } }
:root[data-theme="dark"]{
  --paper:#10151F; --surface:#171E2B; --sunk:#0D121A; --ink:#E5E9F3; --muted:#98A2BC;
  --line:#2B3448; --rule:#222A3A; --accent:#E2A93A; --accent-soft:#3A2E14; --on-accent:#17120A;
  --up:#4BC488; --down:#F0756B; --warn:#E8B04E; --chip:#222C40; color-scheme:dark;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767 }

*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font:15px/1.5 var(--f-body);margin:0}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.15}
h2{font-size:1.45rem} h3{font-size:1.1rem}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .up{color:var(--up)} .down{color:var(--down)} .warn{color:var(--warn)}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
a{color:var(--accent)}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:var(--paper);}
.bar-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
.brand{font-family:var(--f-display);font-size:1.35rem;letter-spacing:.01em}
.brand small{font-family:var(--f-mono);font-size:.68rem;opacity:.65;margin-left:6px;letter-spacing:.06em}
.clock{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.clock b{font-family:var(--f-mono);font-weight:500;font-size:.95rem}
.clock span{font-size:.75rem;opacity:.7}
.speed{display:flex;gap:2px;background:color-mix(in srgb,var(--paper) 12%,transparent);padding:2px;border-radius:999px}
.speed button{background:none;border:0;color:inherit;padding:4px 10px;border-radius:999px;cursor:pointer;font-family:var(--f-mono);font-size:.8rem}
.speed button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.speed button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bar-stats{display:flex;gap:20px;margin-left:auto;flex-wrap:wrap}
.bar-stats div{display:flex;flex-direction:column;line-height:1.2}
.bar-stats span{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;opacity:.65}
.bar-stats b{font-family:var(--f-mono);font-weight:500}
.bar .icon-btn{background:none;border:1px solid color-mix(in srgb,var(--paper) 30%,transparent);color:inherit;border-radius:var(--r);padding:4px 10px;cursor:pointer;font-size:.8rem}

.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--barh,58px));z-index:19}
.tabs-in{max-width:1240px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:11px 12px 9px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

main{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:22px 80px;display:flex;flex-direction:column;gap:20px}

/* Panels: ledger pages */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 18px 10px;border-bottom:1px solid var(--rule)}
.panel-b{padding:14px 18px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
.split{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;align-items:start}
.split2{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
@media (max-width:860px){.split,.split2{grid-template-columns:minmax(0,1fr)}}

/* Ledger rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--rule);align-items:baseline}
.row:last-child{border-bottom:0}
.row .k{color:var(--muted);min-width:0}
.row .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row .v.wrap{white-space:normal}
.row.total{border-top:1px solid var(--ink);border-bottom:0;margin-top:2px;font-weight:600}
.row.total .k{color:var(--ink)}

.tbl-wrap{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px dashed var(--rule);vertical-align:middle}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
tr.sel td{background:var(--accent-soft)}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 13px;border-radius:var(--r);cursor:pointer;font-weight:500;font-size:.9rem;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:none}
.btn.bad{color:var(--down);border-color:color-mix(in srgb,var(--down) 40%,var(--line))}
.btn.sm{padding:3px 9px;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);min-width:0}
input[type=number],input[type=text],select{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;min-width:0;width:100%}
input[type=number]{font-family:var(--f-mono)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;align-items:end}
.check{display:flex;gap:8px;align-items:center;font-size:.88rem}

.chip{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--ink);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--warn)}
.chip.good{background:color-mix(in srgb,var(--up) 16%,transparent);color:var(--up)}
.chip.bad{background:color-mix(in srgb,var(--down) 16%,transparent);color:var(--down)}
.acct-tabs{display:flex;flex-wrap:wrap;gap:6px}
.acct-tabs button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:.85rem}
.acct-tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.note{font-size:.84rem;color:var(--muted);line-height:1.5;max-width:70ch}
.note b{color:var(--ink);font-weight:600}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 var(--r) var(--r) 0;font-size:.88rem}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:24px;align-items:end}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.big{font-family:var(--f-display);font-size:clamp(2rem,5vw,3.2rem);line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
canvas.chart{width:100%;height:220px;display:block}
canvas.chart.sm{height:150px}

/* Company list */
.co-list{display:flex;flex-direction:column;gap:2px}
.co-item{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid transparent;background:none;padding:9px 10px;border-radius:var(--r);cursor:pointer;width:100%}
.co-item:hover{background:var(--sunk)}
.co-item[aria-current="true"]{background:var(--surface);border-color:var(--line);box-shadow:inset 3px 0 0 var(--accent)}
.co-item .nm{font-weight:600}
.co-item .sub{font-size:.78rem;color:var(--muted);font-family:var(--f-mono)}

.unit{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;background:var(--paper)}
.unit h4{margin:0;font-size:1rem;font-weight:600}
.unit .meta{font-size:.8rem;color:var(--muted)}
.unit .ctl{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:14px;align-items:end}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:none;padding:5px 10px;cursor:pointer}
.stepper span{min-width:2.2em;text-align:center;font-family:var(--f-mono)}
.prog{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;width:160px;max-width:100%}
.prog i{display:block;height:100%;background:var(--accent)}

.hrow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.6fr) 3.2em;gap:10px;align-items:center;font-size:.88rem}
.hrow input{width:100%;accent-color:var(--accent)}
.hrow b{text-align:right;font-weight:500}
.biz-pick button:disabled{opacity:.5;cursor:not-allowed}
.biz-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:8px}
.biz-pick button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.biz-pick button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.biz-pick b{font-weight:600} .biz-pick span{font-size:.78rem;color:var(--muted)}

/* Ledger log */
.ledger{font-family:var(--f-mono);font-size:.82rem}
.ledger .le{display:grid;grid-template-columns:7.5em 1fr;gap:10px;padding:5px 0;border-bottom:1px dashed var(--rule)}
.ledger .le .d{color:var(--muted)}
.ledger .le.news .m{color:var(--accent)}
.ledger .le.bad .m{color:var(--down)}
.ledger .le.good .m{color:var(--up)}
.ledger .m{font-family:var(--f-body);font-size:.88rem;min-width:0}

/* Modal */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--sunk) 70%,transparent);backdrop-filter:blur(2px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:min(640px,100%);box-shadow:0 18px 50px rgba(0,0,0,.18)}
.modal .panel-h{padding:16px 20px 12px}
.modal .panel-b{padding:16px 20px 20px}

/* Toasts */
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:var(--r);font-size:.86rem;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:tin .25s ease-out}
.toast b{color:var(--accent);font-weight:600;display:block;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}

/* Setup */
.setup{max-width:760px;margin:0 auto;padding-block:40px 60px;padding-inline:16px;display:flex;flex-direction:column;gap:22px}
.setup h1{font-size:clamp(2.4rem,7vw,4rem)}
.setup .stamp{align-self:flex-start}
.setup .lede{font-size:1.05rem;max-width:60ch;color:var(--muted)}
.opt-row{display:flex;flex-wrap:wrap;gap:8px}
.opt-row button{border:1px solid var(--line);background:var(--surface);padding:10px 14px;border-radius:var(--r);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:110px}
.opt-row button b{font-family:var(--f-mono);font-weight:500}
.opt-row button span{font-size:.75rem;color:var(--muted)}
.opt-row button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.stamp{display:inline-block;border:2px solid var(--accent);color:var(--accent);font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;padding:3px 8px;transform:rotate(-3deg);text-transform:uppercase}
.note.down{color:var(--down)}
.pie-wrap{position:relative;max-width:320px;margin:0 auto;width:100%}
canvas.pie{width:100%;aspect-ratio:1;display:block}
.pie-tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);padding:6px 10px;border-radius:var(--r);font-size:.8rem;white-space:nowrap;z-index:2}
.pie-tip b{display:block;font-weight:600}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px;vertical-align:baseline}
.sw.neg{background:repeating-linear-gradient(135deg,var(--down) 0 2px,transparent 2px 4px)}
.alert{border:1px solid color-mix(in srgb,var(--down) 45%,var(--line));border-left-width:4px;background:color-mix(in srgb,var(--down) 9%,var(--surface));color:var(--ink);padding:10px 14px;border-radius:var(--r);font-size:.9rem;line-height:1.45}
.alert b{display:block;color:var(--down);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
canvas.map{width:100%;aspect-ratio:2.6;max-width:100%;display:block}
.eyebrow+.unit,.unit+.unit{margin-top:0}
select optgroup{font-weight:600}
textarea{width:100%;min-height:140px;font-family:var(--f-mono);font-size:.75rem;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:8px;color:var(--ink)}
</style>

<div id="app"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
'use strict';
/* ============================================================
   JURAGAN · Indonesian business strategy sim
   1 real second = 1 game hour (at 1×). Data: approximate
   reconstructions of Indonesian macro & IDX history 2005–2024.
   ============================================================ */

// ---------- formatting
const NF = new Intl.NumberFormat('id-ID');
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
const dec = v => v.toLocaleString('id-ID',{maximumFractionDigits: v>=100?0 : v>=10?1 : 2});
function rp(x, full){
  if(!isFinite(x)) return '—';
  const s = x < -0.5 ? '−' : ''; const a = Math.abs(x);
  if(!full){
    if(a>=1e12) return s+'Rp '+dec(a/1e12)+' T';
    if(a>=1e9) return s+'Rp '+dec(a/1e9)+' M';
    if(a>=1e6) return s+'Rp '+dec(a/1e6)+' jt';
  }
  return s+'Rp '+NF.format(Math.round(a));
}
const pc = (v,d=2)=> (v*100).toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
const sgn = (v,f)=> (v>=0?'+':'−')+f(Math.abs(v));
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- time (game clock is hours since 1 Jan 2004 00:00 WIB, stored in UTC fields)
const EPOCH = Date.UTC(2004,0,1), HR = 3600e3;
const dOf = h => new Date(EPOCH + h*HR);
const hOf = (y,m,d,hr=0) => Math.round((Date.UTC(y,m,d,hr)-EPOCH)/HR);
const kOf = dt => dt.getUTCFullYear()*10000 + (dt.getUTCMonth()+1)*100 + dt.getUTCDate();
const hK = k => hOf(Math.floor(k/10000), Math.floor(k/100)%100-1, k%100);
const keyH = h => kOf(dOf(h));
const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const BLN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function fdate(h){ const d=dOf(h); return d.getUTCDate()+' '+BLN[d.getUTCMonth()]+' '+d.getUTCFullYear(); }
function fkey(k){ return (k%100)+' '+BLN[Math.floor(k/100)%100-1]+' '+Math.floor(k/10000); }
function addMonths(h,n){ const d=dOf(h); return hOf(d.getUTCFullYear(), d.getUTCMonth()+n, Math.min(d.getUTCDate(),28), 0); }
function yfrac(h){ const d=dOf(h), y=d.getUTCFullYear(); const a=hOf(y,0,1), b=hOf(y+1,0,1); return y+(h-a)/(b-a); }
const yearOf = h => dOf(h).getUTCFullYear();

// ---------- RNG
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){let u=0;while(u===0)u=r();const v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function hash3(a,b,c){let h=(2166136261^a)>>>0;h=Math.imul(h^b,16777619);h=Math.imul(h^c,16777619);h^=h>>>13;h=Math.imul(h,0x5bd1e995);h^=h>>>15;return (h>>>0)/4294967296}
function hg(a,b,c){const u=Math.max(1e-9,hash3(a,b,c)),v=hash3(c+7,a+3,b+11);return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const rnd = ()=>Math.random();
const rg = ()=>gauss(Math.random);

/* ============================================================
   HISTORICAL DATA (approximate; replace with a real feed later)
   ============================================================ */
// CPI inflation, year-on-year at December (BPS)
const INF={2005:17.11,2006:6.60,2007:6.59,2008:11.06,2009:2.78,2010:6.96,2011:3.79,2012:4.30,2013:8.38,2014:8.36,2015:3.35,2016:3.02,2017:3.61,2018:3.13,2019:2.72,2020:1.68,2021:1.87,2022:5.51,2023:2.61,2024:1.57,2025:2};
const CPI0={}; (()=>{let v=1;for(let y=2005;y<=2026;y++){CPI0[y]=v;v*=1+(INF[y]||2)/100;}})();

let MK=null; // series → Float64Array of daily closes
function buildMarket(seed){
  const rng=mulberry((seed>>>0)^0x9e3779b9), N=TD.length;
  const L=new Float64Array(N);
  const anc=IHSG_A.map(([k,v])=>[tdLE(k),Math.log(v)]);
  for(let a=0;a<anc.length-1;a++){
    const [i0,v0]=anc[a],[i1,v1]=anc[a+1], n=i1-i0; if(n<=0) continue;
    const w=[0]; for(let k=1;k<=n;k++) w.push(w[k-1]+gauss(rng)*0.0115);
    for(let k=0;k<=n;k++) L[i0+k]=v0+w[k]+(k/n)*((v1-v0)-w[n]);
  }
  const YE=[]; for(let y=2004;y<=2024;y++) YE.push(tdLE(y*10000+1231));
  const lin=(vals)=>{ const out=new Float64Array(N); for(let s=0;s<YE.length-1;s++){ const a=YE[s],b=YE[s+1]; for(let i=a;i<=b;i++) out[i]=vals[s]+(vals[s+1]-vals[s])*(i-a)/(b-a); } return out; };
  const yI=[]; for(let y=2004;y<=2024;y++) yI.push(Math.log(IHSG_A.find(a=>a[0]===y*10000+1231)[1]));
  const LinI=lin(yI);
  MK={IHSG:new Float64Array(N)};
  for(let i=0;i<N;i++) MK.IHSG[i]=Math.round(Math.exp(L[i])*100)/100;
  for(const st of STOCKS){
    const LinS=lin(st.p.map(Math.log)), idio=new Float64Array(N);
    for(let s=0;s<YE.length-1;s++){ const a=YE[s],b=YE[s+1],n=b-a; const w=[0]; for(let k=1;k<=n;k++) w.push(w[k-1]+gauss(rng)*0.014); for(let k=0;k<=n;k++) idio[a+k]=w[k]-(k/n)*w[n]; }
    const arr=new Float64Array(N);
    for(let i=0;i<N;i++) arr[i]=roundTick(Math.exp(LinS[i]+st.b*(L[i]-LinI[i])+idio[i]));
    MK[st.s]=arr;
  }
  MK.Y10=yieldPath(rng);
}
function quote(sym,h){
  const arr=MK[sym], d=dOf(h), k=kOf(d), hr=d.getUTCHours(), i=tdLE(k);
  if(TD[i]===k && hr<16){
    if(hr<9) return arr[Math.max(0,i-1)];
    const f=(hr-8)/8, lp=Math.log(arr[Math.max(0,i-1)]), lc=Math.log(arr[i]);
    const v=Math.exp(lp+f*(lc-lp)+Math.sqrt(f*(1-f))*0.008*hg(i,hr,sym.charCodeAt(1)*31+sym.charCodeAt(2)));
    return sym==='IHSG'?Math.round(v*100)/100:roundTick(v);
  }
  return arr[i];
}
function prevClose(sym,h){ const i=tdLE(keyH(h)); return MK[sym][Math.max(0,i-1)]; }
function isOpen(h){ const d=dOf(h), k=kOf(d), hr=d.getUTCHours(); return TD[tdLE(k)]===k && hr>=9 && hr<16; }

function bondPx(b,h){
  h=h??S.h; if(h>=b.mat) return 1;
  const rem=(b.mat-h)/YRH, y=(yieldAt(rem,h)+(b.kind==='ORI'?0.25:0))/100, f=b.freq, c=b.cpn/100/f;
  let nc=b.nc||nextCpn(b,h), pv=0;
  while(nc<=b.mat){ const t=(nc-h)/YRH; pv+=(c+(nc>=b.mat-24?1:0))/Math.pow(1+y/f,t*f); if(nc>=b.mat-24) break; nc=addMonths(nc,12/f); }
  return pv;
}

function bondOffers(a){

  for(const row of ORI_HIST){ const s=oriSeries(row), open=hK(row[0])-21*24;

  for(const T of [5,10,20]){ const cpn=Math.round(yieldAt(T,h)*8)/8; out.push({kind:'FR',name:`FR ${T}Y ${yearOf(h)+T}`,cpn,iss:h,mat:addMonths(h,12*T),freq:2,key:'f'+T,px:1,fee:0.001,min:10e6,label:`SUN FR ${T}-year · new issue · ${pc(cpn/100,2)} · due ${yearOf(h)+T}`,note:'Fixed-rate government bond (Seri FR) bought at the auction through the bank, at par. Semi-annual coupons. Its price moves against market yields: long tenors move most.'}); }
  return out.sort((x,y)=>'pfs'.indexOf(x.key[0])-'pfs'.indexOf(y.key[0]));

function buyBond(a,key,face){
  const o=bondOffers(a).find(x=>x.key===key); if(!o) return 'That bond is no longer on offer. Pick another.';
  face=Math.floor((+face||0)/1e6)*1e6;
  if(face<o.min) return `The minimum for ${o.name} is ${rp(o.min)} face value, in multiples of Rp 1 juta.`;
  if(o.kind==='ORI'&&key[0]==='p'&&a.id!=='P') return 'Retail ORI is only sold to individuals. A company can buy SUN FR series, or ORI on the secondary market.';
  const cost=face*o.px*(1+o.fee); if(a.cash<cost) return `Not enough in ${acctName(a.id)}'s account: ${rp(cost)} needed, ${rp(a.cash)} available.`;
  a.cash-=cost; const b={id:nid('G'),kind:o.kind,name:o.name,face,cpn:o.cpn,iss:o.iss,mat:o.mat,freq:o.freq,cost}; b.nc=nextCpn(b,Math.max(S.h,o.iss-1)); (a.bonds||(a.bonds=[])).push(b);
  logm(`${acctName(a.id)} bought ${rp(face)} of ${o.name} (coupon ${String(o.cpn).replace('.',',')}%, due ${fdate(o.mat)}) for ${rp(cost)}.`,'good'); return null;
}
function sellBond(a,id){
  const b=(a.bonds||[]).find(x=>x.id===id); if(!b) return 'That bond is gone.';
  const gross=b.face*bondPx(b)*(1-0.002), gain=gross-b.cost, tax=gain>0?gain*bondTax(S.h):0, net=gross-tax;
  a.cash+=net; a.bonds.splice(a.bonds.indexOf(b),1);
  if(Math.abs(gain-tax)>0.5){ book(a,'other',gain-tax); srcAdd(a,'bondgain',gain-tax); }
  logm(`${acctName(a.id)} sold ${rp(b.face)} of ${b.name} for ${rp(net)}: ${gain>=0?'gain':'loss'} of ${rp(Math.abs(gain-tax))}${tax?` after ${pc(bondTax(S.h),0)} final tax`:''}.`,gain>=0?'good':'bad'); return null;
}
function bondDay(){

const H_UU40=hK(20070816), H_CIPTA=hK(20201102), H_PTP=hK(20210202), H_KUR=hK(20071105), H_IDX=hK(20071203), H_LOT=hK(20140106), H_LPS=hK(20050922);

function lawPT(h){
  if(h<H_UU40) return {law:'UU No. 1/1995 tentang Perseroan Terbatas', minAuth:20e6, minPaid:5e6, founders:2, note:'Authorised capital ≥ Rp 20 juta, at least 25% paid up. Minimum two founders.'};
  if(h<H_CIPTA) return {law:'UU No. 40/2007 tentang Perseroan Terbatas', minAuth:50e6, minPaid:12.5e6, founders:2, note:'Authorised capital ≥ Rp 50 juta, at least 25% paid up. Minimum two founders. 20% statutory reserve before full dividend payout (Art. 70).'};
  return {law:'UU 40/2007 as amended by UU No. 11/2020 (Cipta Kerja)', minAuth:0, minPaid:0, founders:2, note:'Capital set by the founders. Minimum two founders for a regular PT; single-founder PT Perorangan for micro and small businesses'+(h<H_PTP?' once PP 8/2021 takes effect.':' (PP 8/2021).')};
}
const FORMS={
  UD:{n:'Usaha Dagang (sole proprietorship)', short:'UD', fee:0.5e6, legal:false},
  CV:{n:'Persekutuan Komanditer (CV)', short:'CV', fee:3e6, legal:false},
  PT:{n:'Perseroan Terbatas (PT)', short:'PT', fee:8e6, legal:true},
  PTP:{n:'PT Perorangan', short:'PT', fee:0, legal:true},
};
function formFee(form,h){ if(form==='PTP') return 50000; return Math.round(FORMS[form].fee*cpi(h)/1000)*1000; }
function citRate(y){ return y<=2008?null : y===2009?0.28 : y<2020?0.25 : 0.22; }
function cit(y,taxable,annualRev){
  if(taxable<=0) return 0;
  if(y<=2008){ let t=Math.min(taxable,50e6)*0.10; if(taxable>50e6) t+=Math.min(taxable-50e6,50e6)*0.15; if(taxable>100e6) t+=(taxable-100e6)*0.30; return t; }
  const r=citRate(y);
  if(annualRev<=4.8e9) return taxable*r*0.5;
  if(annualRev<=50e9){ const f=4.8e9/annualRev; return taxable*f*r*0.5+taxable*(1-f)*r; }
  return taxable*r;
}
function ptkp(y){ return y<=2005?12e6 : y<=2008?13.2e6 : y<=2012?15.84e6 : y<=2014?24.3e6 : y===2015?36e6 : 54e6; }
function pitBrackets(y){
  if(y<=2008) return [[25e6,.05],[50e6,.10],[100e6,.15],[200e6,.25],[Infinity,.35]];
  if(y<=2021) return [[50e6,.05],[250e6,.15],[500e6,.25],[Infinity,.30]];
  return [[60e6,.05],[250e6,.15],[500e6,.25],[5e9,.30],[Infinity,.35]];
}
function pit(y,pkp){ if(pkp<=0) return 0; let t=0,prev=0; for(const [cap,r] of pitBrackets(y)){ if(pkp>prev){ t+=(Math.min(pkp,cap)-prev)*r; } prev=cap; } return t; }
function pph21(h,monthly){ const y=yearOf(h); return pit(y,monthly*12-ptkp(y))/12; }
function divTaxIndiv(h){ return yearOf(h)<2009?0.15:0.10; }
function divTaxCorp(h,pct){ if(h>=H_CIPTA) return 0; return pct>=0.25?0:0.15; }
function bpjsRate(h){ const k=keyH(h); return k<20140101?0.0624 : k<20150701?0.0824 : 0.1024; }
function bpjsLabel(h){ const k=keyH(h); return k<20140101?'Jamsostek (JKK, JKM, JHT, JPK)':k<20150701?'BPJS Kesehatan 4% + Jamsostek/BPJS TK':'BPJS Kesehatan 4% + BPJS TK (JKK, JKM, JHT 3,7%, JP 2%)'; }
function lpsCap(h){ const k=keyH(h); return k<20050922?'Government blanket guarantee (pre-LPS)':k<20060322?'Full guarantee (LPS transition)':k<20060922?'Rp 5 miliar':k<20070322?'Rp 1 miliar':k<20081013?'Rp 100 juta':'Rp 2 miliar'; }
function umkmRegime(c,y,m){
  const ym=y*100+m+1, prev=c.prevTurnover, small=(prev==null||prev<=4.8e9);
  if(ym<201307||!small) return {k:'normal',label:'Normal (profit-based)'};
  if(ym<201807) return {k:'final',r:0.01,label:'PP 46/2013 · 1% final on turnover'};
  const startY=Math.max(2018,yearOf(c.founded)), lim=c.form==='UD'?7:c.form==='CV'?4:c.form==='PTP'?4:3;
  if(y-startY<lim) return {k:'final',r:0.005,label:`PP 23/2018 · 0,5% final (until end of ${startY+lim-1})`};
  return {k:'normal',label:'Normal (PP 23 period ended)'};
}
function kurTerms(h){
  if(h<H_KUR) return null; const y=yearOf(h);
  const r = y<2015?null : y===2015?0.12 : y<=2017?0.09 : y<=2019?0.07 : 0.06;
  return {mikroMax: y<2015?20e6 : y<2020?25e6 : y<2023?50e6 : 100e6, mikroRate: r??0.22, kecilMax:500e6, kecilRate: r??0.13};
}

function nwP(){ return liquid(S.P)-debt(S.P)+stakesP(); }
function recordNW(){ const v=nwP(); const last=S.nwh[S.nwh.length-1]; if(last&&last[0]===S.h) return; S.nwh.push([S.h,Math.round(v)]); }
function kol(a){ let m=0; for(const l of a.loans) m=Math.max(m,l.miss); return m===0?1:m<=2?2:m===3?3:m<=5?4:5; }
const KOL=['','Lancar','Dalam Perhatian Khusus','Kurang Lancar','Diragukan','Macet'];
function avgRev3(c){ const h=c.hist.slice(-3); if(!h.length) return c.mon.rev; return h.reduce((s,x)=>s+x.rev,0)/h.length; }

/* ============================================================
   SIMULATION
   ============================================================ */
function step(){
  S.h++;
  const d=dOf(S.h), hr=d.getUTCHours();
  if(hr===0){ newDay(d); if(S.over) return; }
  // retail sales by the hour
  for(const c of S.C) for(const u of c.units){
    const b=BIZ[u.t]; if(b.kind!=='retail'||u.w<=0) continue;
    if(hr<b.open[0]||hr>=b.open[1]) continue;
    const daily=b.lv[u.lv].rev*cpi(S.h)*REG[u.reg].dem*staffF(u)*moraleF(u,S.h)*(u.t==='wisata'?1:seasonRetail(S.h))*shockF(u.t,u.reg,S.h)*(u.df||1)*retailMult(u.t,u.reg)*mgmtF(c)*(1-leak(c,u))*(1+0.08*fnScore(c,'mkt')/100)*(1+0.04*fnScore(c,'hr')/100);
    const rev=daily/(b.open[1]-b.open[0])*Math.max(0.2,1+0.2*rg());
    const cogs=rev*(1-b.margin)*(1-0.04*jobQ(c,'proc'));
    c.cash+=rev-cogs; book(c,'rev',rev); book(c,'cogs',cogs); u.mrev=(u.mrev||0)+rev; const m=um(u); m.rev+=rev; m.cost+=cogs;
  }
  if(S.orders.length && isOpen(S.h)) runOrders();
}

function newDay(d){
  const k=kOf(d), day=d.getUTCDate(), m=d.getUTCMonth(), y=d.getUTCFullYear();
  if(k>END_KEY){ monthClose(y,m); yearClose(y-1); endGame('The historical record ends on 31 December 2024.'); return; }
  while(S.news<NEWS.length && NEWS[S.news][0]<=k){ const n=NEWS[S.news++]; logm(n[1],'news'); toast(fkey(n[0]),n[1]); }
  if(day===1){ monthClose(y,m); if(m===0){ yearClose(y-1); S.bench.fraudY=0; } }
  if(m===0&&day===1) newYearWages(y);
  if(m===3&&day===30) payCIT();
  if(m===5&&day===15) stockDividends();
  if(LEBK[y] && k===keyH(hK(LEBK[y])-7*24)) payTHR();
  if(day===20) for(const {c} of orderedCos().reverse()) if(c.rups&&c.rups.month===m&&S.C.includes(c)) rupsRun(c);
  if(day===25) payroll();
  for(const c of [...S.C]) for(const u of c.units){
    if(BIZ[u.t].kind==='retail'){ u.df=Math.exp(0.1*rg()); continue; }
    if(u.ph==='grow'){ u.d++; if(u.d>=BIZ[u.t].cycle) harvest(c,u); }
    else if(u.auto) tryStart(c,u,true);
  }
  for(const a of [S.P,...S.C]){ dueLoans(a); matureDeps(a); }
  bondDay();
  for(const a of [S.P,...S.C]) if(a.loans.some(l=>l.miss>=6)) forcedLiquidation(a);
  recordNW();
  S.dayDirty=true;
}

function tryStart(c,u,quiet){
  const b=BIZ[u.t], cost=b.lv[u.lv].input*cpi(S.h)*(b.land?landAdj(u.reg):1)*(1-0.04*jobQ(c,'proc'));
  if(c.cash<cost){ if(!u.wait) logm(`${coName(c)}: ${b.n} is idle, waiting for ${rp(cost)} in the company account to restock.`,'bad'); u.wait=true; return false; }
  c.cash-=cost; book(c,'cogs',cost); um(u).cost+=cost; u.ph='grow'; u.d=0; u.wait=false; u.inCost=cost; return true;
}
function harvest(c,u){
  const b=BIZ[u.t], L=b.lv[u.lv];
  const fail=rnd()<b.fail*(1-0.5*jobQ(c,'qc'));
  const kg=Math.round(L.yield*(u.w<=0?0.35:0.6+0.4*Math.min(1.08,staffF(u)))*moraleF(u,S.h)*specF(u)*mgmtF(c)*(1-leak(c,u))*(1+0.04*fnScore(c,'hr')/100)*Math.exp(0.07*rg())*(fail?0.2+0.3*rnd():1));
  const price=Math.round(commodityPrice(u.t,S.h)*Math.exp(b.vol*rg())*(1+0.05*fnScore(c,'mkt')/100)/10)*10;
  const rev=kg*price;
  c.cash+=rev; book(c,'rev',rev); um(u).rev+=rev;
  u.last={kg,price,rev,cost:u.inCost||0,fail,h:S.h};
  u.ph='idle'; u.d=0;
  logm(`${coName(c)} · ${b.n}: ${fail?'poor harvest, ':''}${NF.format(kg)} ${unitOf(b)} ${b.prod} at ${rp(price,true)}/${unitOf(b)} = ${rp(rev)}.`, fail?'bad':(rev>(u.inCost||0)?'good':''));
  if(u.auto) tryStart(c,u);
}

function monthClose(y,m){
  // m is the month that just started; close the previous month
  const pd=new Date(Date.UTC(y,m,1)-864e5), py=pd.getUTCFullYear(), pm=pd.getUTCMonth();
  const h=S.h;
  for(const a of [S.P,...S.C]){
    if(a.cash>0){ const gross=a.cash*savRate(h)/12, net=gross*(a.cash>7.5e6?0.8:1); a.cash+=net; book(a,'other',net); srcAdd(a,'int',net); }
    else if(a.cash<0){ const od=-a.cash*0.02; a.cash-=od; book(a,'intx',od); if(a.id==='P') expAdd('interest',od); logm(`${a.id==='P'?'Personal account':coName(a)}: overdraft charge ${rp(od)}.`,'bad'); }
  }
  S.bench.bDep*=1+depRate(h,12)*0.8/12;
  billFees(); billOuts();
  for(const c of S.C){
    const uNets={};
    for(const v of c.divs||[]){ const r=divRent(v.reg,h); c.cash-=r; book(c,'opex',r); }
    for(const u of c.units){
      const L=BIZ[u.t].lv[u.lv];
      const ox=L.opex*cpi(h)*REG[u.reg].land*(1-0.05*jobQ(c,'ga')); c.cash-=ox; book(c,'opex',ox);
      const mc=monCost(c,u); c.cash-=mc; book(c,'mon',mc);
      if(u.t==='bpr'){ const yy=yearOf(h), crisis=(yy===2008||yy===2009||yy===2020||yy===2021)?2:1; if(rnd()<0.05*crisis*(1-0.5*jobQ(c,'risk'))*(1-0.4*fnScore(c,'fin')/100)){ const bl=Math.round(u.cap*(0.02+0.06*rnd())); c.cash-=bl; book(c,'loss',bl); um(u).cost+=bl; logm(`${coName(c)} · BPR in ${REG[u.reg].n}: a batch of loans went bad (kredit macet). Write-off ${rp(bl)}. Risk management and a strong finance team reduce this.`,'bad'); } }
      const dp=Math.min(u.book,u.cap*(BIZ[u.t].depr??1)/48); if(dp>0){ u.book-=dp; book(c,'dep',dp); }
      if(u.w>0 && u.sal<umr(u.reg,h) && rnd()<0.07*(1-0.8*fnScore(c,'hr')/100)){
        const short=(umr(u.reg,h)-u.sal)*u.w*6, fine=Math.round(short*1.1);
        c.cash-=fine; book(c,'fine',fine); u.sal=umr(u.reg,h);
        logm(`Labour inspection (Disnaker) at ${coName(c)}, ${REG[u.reg].n}: wages below UMR. Back pay and fine ${rp(fine)}. Wage raised to ${rp(u.sal,true)}.`,'bad');
        toast('Disnaker inspection',`${coName(c)} fined ${rp(fine)} for paying under UMR.`);
      }
      { const m=um(u); m.cost+=ox+mc+dp; (u.mh||(u.mh=[])).push(Math.round(m.rev-m.cost)); uNets[u.id]=[`${BIZ[u.t].n} · ${REG[u.reg].n}`,Math.round(m.rev-m.cost)]; if(u.mh.length>24) u.mh.shift(); u.m={rev:0,cost:0}; }
      u.mrev=0;
    }
    for(const f of allPeople(c)){ const b=f.p; if(b.src==='pro'&&b.mkt>0&&b.sal<0.8*b.mkt&&rnd()<0.25*(1-0.6*fnScore(c,'hr')/100)){ removePerson(c,f); logm(`${b.name} resigned from ${coName(c)}: ${rp(b.sal)} a month is well below the ${rp(b.mkt)} the market pays.`,'bad'); toast('Resignation',`${b.name} left ${coName(c)} over pay.`); S.dirty=true; } }
    const G=gov(c);
    const fin=fnScore(c,'fin');
    for(const f of allPeople(c)){
      const b=f.p; if(c.cash<=0) continue;
      const p=Math.pow((100-effInteg(b))/100,2)*0.06*(1-0.75*G/100)*(FRAUDW[b.role||b.tier]||0.4)*(1-0.6*fin/100)*(1-0.3*jobQ(c,'risk'));
      if(rnd()>=p) continue;
      const amt=Math.round(Math.min(c.cash,Math.max(5e6*cpi(h),c.cash*(0.03+0.07*rnd()))));
      c.cash-=amt; book(c,'loss',amt); S.bench.fraudY++;
      if(rnd()<0.25+0.6*G/100+0.3*fin/100+0.35*jobQ(c,'audit')){ const back=Math.round(amt*0.4), t=personTitle(c,f); c.cash+=back; book(c,'loss',-back); removePerson(c,f);
        logm(`${coName(c)}: ${fin>G?'the finance team':'the commissioners'} caught ${t} ${b.name} diverting ${rp(amt)}. ${rp(back)} recovered and ${b.name} is dismissed.`,'bad'); toast('Fraud uncovered',`${b.name} skimmed ${rp(amt)} from ${coName(c)}.`); }
      else logm(`${coName(c)}: ${rp(amt)} is missing from the accounts and nobody can explain it. Stronger commissioners catch this.`,'bad');
      S.dirty=true;
    }
    const reg=umkmRegime(c,py,pm); c.regime=reg;
    if(reg.k==='final'){
      let base=c.mon.rev;
      if(c.form==='UD' && py>=2022){ const before=c.ytd.rev-c.mon.rev; base=Math.max(0,c.ytd.rev-Math.max(500e6,before)); }
      const t=base*reg.r; if(t>0){ c.cash-=t; book(c,'tax',t); }
    } else {
      const p=c.mon; book(c,'tn',p.rev-p.cogs-p.wage-p.opex-p.mon-p.dep-p.intx+(p.mfi||0)-(p.mfee||0)-(p.outs||0));
    }
    const names={}; for(const key in c.srcM||{}){ const id=key.split(':')[1]; if(id){ const x=acct(id); names[id]=x?coName(x):'(closed company)'; } }
    c.hist.push({k:py*100+pm+1,...c.mon,net:netOf(c.mon),bs:balanceOf(c),src:c.srcM||{},units:uNets,names}); c.srcM={};
    if(c.hist.length>240) c.hist.shift();
    c.mon=blankPL();
    updateLevel(c);
    for(const d of c.depts||[]) staffDept(c,d);
    for(const v of c.divs||[]) if(!v.head){ v.head=autoHead(c,v,-2); v.head.tier='divhead'; const fee=2*v.head.sal; c.cash-=fee; book(c,'opex',fee); logm(`${coName(c)} recruited ${v.head.name} to head ${v.name} (fee ${rp(fee)}).`); }
    corpRisks(c,h);
  }
  closePersonalMonthPending=py*100+pm+1;
  if(S.living){
    const lc=livingCost(h), P=S.P; P.cash-=lc; expAdd('living',lc);
    if(P.cash<0){ logm(`Living costs of ${rp(lc)} overdrew your personal account to ${rp(P.cash)}. Overdraft costs 2% a month: pay yourself from a company or sell assets.`,'bad'); toast('Personal account overdrawn','Living costs exceed your balance. Pay yourself from a company or sell assets.'); }
  }
  closePersonalMonth(closePersonalMonthPending);
  if(S.tab==='rep') S.dirty=true;
}
let closePersonalMonthPending=null;
function migrateOrg(c){ c.depts=c.depts||[]; if(!(c.org||[]).length){ delete c.org; return; }
  const lv=c.level||0; for(const fn of FNS){ const ps=c.org.filter(p=>p.fn===fn); if(!ps.length) continue; const jobs=jobsAt(lv).filter(j=>JOBS[j].fn===fn&&!deptOf(c,j)); if(!jobs.length) continue;
    const best=ps.sort((a,b)=>b.skill-a.skill)[0]; c.depts.push({id:nid('T'),name:{fin:'Keuangan',ops:'Operasional',mkt:'Pemasaran',hr:'SDM'}[fn],jobs,head:{...best,tier:'dhead',hl:lv},staff:Math.max(1,ps.length-1),staffSal:staffPay(c),since:S.h}); }
  delete c.org; }
function corpRisks(c,h){
  if(!c.units.length) return;
  const lv=c.level||0, lg=1-0.3*jobQ(c,'legal'), wages=c.units.reduce((s,u)=>s+u.w*u.sal,0);
  const f=(j,base,chance,msg)=>{ if(JOBS[j].lv>lv) return; const q=jobQ(c,j); if(rnd()<chance*(1-q)){ const fine=Math.round(base*lg*(1-0.5*q)/1000)*1000; c.cash-=fine; book(c,'fine',fine); logm(`${coName(c)}: ${msg} Fine ${rp(fine)}.`,'bad'); S.dirty=true; } };
  f('payroll',Math.max(2e6*cpi(h),wages*0.3),0.03,'a BPJS Ketenagakerjaan audit found contributions reported late.');
  f('regrep',15e6*cpi(h)*(1+lv),0.04,'reports to the ministry and Disnaker (LKPM, WLKP) were filed late.');
  f('qc',20e6*cpi(h)*lv,0.02,'a K3 workplace safety inspection found violations.');
  f('ir',10e6*cpi(h)*lv,0.02,'a labour dispute went to the Disnaker mediator.');
}
function livingCost(h){ return 1.5e6*cpi(h)*(0.55+0.45*umr(S.home,h)/umr('3171',h)); }
function yearClose(y){
  for(const c of S.C){
    let taxable=c.ytd.tn;
    if(c.ytd.mfee>0.05*c.ytd.rev&&c.form!=='UD'){ const ex=c.ytd.mfee-0.05*c.ytd.rev; taxable+=ex; logm(`${coName(c)}: the tax office treats ${rp(ex)} of management fees above 5% of revenue as non-deductible for ${y} (koreksi fiskal).`,'bad'); }
    let tax=0;
    if(taxable>0) tax = c.form==='UD' ? pit(y,taxable-ptkp(y)) : cit(y,taxable,c.ytd.rev);
    if(tax>0&&c.form!=='UD'){ const q=jobQ(c,'tax'); if(rnd()<0.6*(1-q)){ const pen=Math.round(tax*0.1*(1-q)); tax+=pen; logm(`${coName(c)}: the ${y} tax return had errors. Administrative penalty ${rp(pen)} (sanksi administrasi). A team handling tax filing prevents this.`,'bad'); } }
    if((c.level||0)>=3&&c.units.some(u=>RESOURCE.includes(u.t))){ const q=jobQ(c,'csr'); if(q<0.5){ const fine=Math.round(50e6*cpi(S.h)*(1-q)); c.cash-=fine; book(c,'fine',fine); logm(`${coName(c)}: no adequate CSR programme for ${y} although it works with natural resources (UU 40/2007 Art. 74, PP 47/2012). Sanction ${rp(fine)}.`,'bad'); } }
    if(c.pph23>0){ const cr=Math.min(tax,c.pph23); if(cr>0) logm(`${coName(c)} credits ${rp(cr)} of PPh 23 withheld on management fees against its ${y} income tax.`); tax-=cr; c.pph23=0; }
    if(tax>0){
      c.taxDue=(c.taxDue||0)+tax; c.taxDueH=hOf(y+1,3,30); c.retained-=tax;
      const last=c.hist[c.hist.length-1]; if(last){ last.net-=tax; last.tax+=tax; }
      c.ytd.tax+=tax;
      logm(`${coName(c)}: ${c.form==='UD'?'personal income tax on business profit':'corporate income tax (PPh Badan)'} for ${y} assessed at ${rp(tax)}, due 30 April.`);
    }
    c.prevTurnover=c.ytd.rev; c.ytdPrev={...c.ytd,y}; c.ytd=blankPL();
  }
}
function payCIT(){ for(const c of S.C) if(c.taxDue>0){ c.cash-=c.taxDue; logm(`${coName(c)} paid ${rp(c.taxDue)} annual income tax.`); c.taxDue=0; } }
function newYearWages(y){
  logm(`New minimum wages for ${y}. UMP DKI Jakarta is now ${rp(UMP[y]||UMP[2025],true)}.`,'news');
  for(const c of S.C){ let n=0; for(const u of c.units){ const m=umr(u.reg,S.h); if(c.autoUMR && u.sal<m){ u.sal=m; n++; } } if(n) logm(`${coName(c)}: raised ${n} wage line(s) to the new UMR.`); payReview(c,y); }
}
function payroll(){
  const br=bpjsRate(S.h);
  for(const c of S.C){
    let staff=0; for(const u of c.units){ const w=u.w*u.sal*(1+br); staff+=w; um(u).cost+=w; }
    for(const d of c.depts||[]) staff+=d.staff*d.staffSal*(1+br);
    let brd=0; for(const {p} of allPeople(c)) brd+=p.sal;
    const me=c.dir>0&&onBoard(c,'P')?c.dir:0, tot=staff+brd+me;
    if(tot<=0) continue;
    c.cash-=tot; book(c,'wage',tot);
    if(me){ S.P.cash+=me-pph21(S.h,me); srcAdd(S.P,'sal:'+c.id,me-pph21(S.h,me)); }
    logm(`Gajian at ${coName(c)}: ${rp(tot)}${staff?`, staff and teams ${rp(staff)} incl. ${(br*100).toLocaleString('id-ID')}% employer social security`:''}${brd?`, board and management ${rp(brd)}`:''}${me?`, your pay ${rp(me-pph21(S.h,me))} net of PPh 21`:''}.`);
  }
}
function payTHR(){
  for(const c of S.C){
    let tot=0; for(const u of c.units){ tot+=u.w*u.sal; um(u).cost+=u.w*u.sal; } for(const {p} of allPeople(c)) tot+=p.sal; for(const d of c.depts||[]) tot+=d.staff*d.staffSal;
    const me=c.dir>0&&onBoard(c,'P')?c.dir:0; if(me){ S.P.cash+=me-pph21(S.h,me); srcAdd(S.P,'sal:'+c.id,me-pph21(S.h,me)); tot+=me; }
    if(tot>0){ c.cash-=tot; book(c,'wage',tot); logm(`THR (Lebaran bonus) paid at ${coName(c)}: ${rp(tot)}, one month's pay for staff and board, due H-7 by law.`); }
  }
}
function stockDividends(){
  for(const a of [S.P,...S.C]) for(const s in a.hold){
    const st=STK[s], sh=a.hold[s].sh; if(!sh) continue;
    const gross=sh*MK[s][lastFullIdx(S.h)]*st.y;
    const rate=a.id==='P'?divTaxIndiv(S.h):divTaxCorp(S.h,0.01), net=gross*(1-rate);
    a.cash+=net; book(a,'other',net); srcAdd(a,'stkdiv',net);
    logm(`${acctName(a.id)} received ${rp(net)} dividend from ${s}${rate?` after ${pc(rate,0)} withholding`:''}.`,'good');
  }
}

/* ---------- banking */
function annuity(P,r,n){ const i=r/12; return i===0?P/n:P*i/(1-Math.pow(1+i,-n)); }
function dueLoans(a){
  for(const l of [...a.loans]){
    if(S.h<l.due) continue;
    const pay=l.pay, avail=a.cash;
    const interest=l.bal*l.r/12;
    if(avail>=pay){
      a.cash-=pay;
      book(a,'intx',interest); if(a.id==='P') expAdd('interest',interest); l.bal=Math.max(0,l.bal-(pay-interest)); l.left--; l.miss=0;
      if(l.left<=0||l.bal<1){ a.loans.splice(a.loans.indexOf(l),1); logm(`${acctName(a.id)}: ${l.name} paid off.`,'good'); S.dirty=true; continue; }
    } else {
      const pen=pay*0.02; l.bal+=interest+pen; book(a,'intx',interest+pen); if(a.id==='P') expAdd('interest',interest+pen); l.miss++;
      l.pay=annuity(l.bal,l.r,l.left);
      logm(`${acctName(a.id)} missed a ${l.name} instalment of ${rp(pay)}. Credit status: ${KOL[kol(a)]}.`,'bad');
      toast('Missed instalment',`${acctName(a.id)} · ${l.name}. Status: ${KOL[kol(a)]}.`);
    }
    l.due=addMonths(l.due,1);
  }
}
function matureDeps(a){
  for(const d of [...a.deps]){
    if(S.h<d.mat) continue;
    const net=d.amt*d.r*d.m/12*0.8;
    a.cash+=net; book(a,'other',net); srcAdd(a,'int',net);
    if(d.aro){ d.r=depRate(S.h,d.m); d.mat=addMonths(S.h,d.m); logm(`${acctName(a.id)}: deposito rolled over (ARO) at ${pc(d.r)}; interest ${rp(net)} credited.`); }
    else { a.cash+=d.amt; a.deps.splice(a.deps.indexOf(d),1); logm(`${acctName(a.id)}: deposito of ${rp(d.amt)} matured, ${rp(net)} interest after 20% final tax.`,'good'); }
    S.dirty=true;
  }
}
function forcedLiquidation(a){
  logm(`Bank declares ${acctName(a.id)}'s loan Macet (kolektibilitas 5) and seizes assets.`,'bad');
  toast('Kredit macet',`The bank is seizing assets from ${acctName(a.id)}.`);
  for(const d of a.deps) a.cash+=d.amt; a.deps=[];
  for(const s in a.hold){ a.cash+=a.hold[s].sh*quote(s,S.h)*0.9975; } a.hold={};
  for(const b of a.bonds||[]) a.cash+=b.face*bondPx(b)*0.995; a.bonds=[];
  if(a.id!=='P'){ for(const u of a.units) a.cash+=u.book*0.4; a.units=[]; }
  for(const l of [...a.loans]){ const p=Math.min(Math.max(a.cash,0),l.bal); a.cash-=p; l.bal-=p; if(l.bal<1) a.loans.splice(a.loans.indexOf(l),1); else { l.miss=3; l.pay=annuity(l.bal,l.r,Math.max(6,l.left)); } }
  if(a.id==='P' && a.loans.length){ endGame('Personal bankruptcy (pailit): the bank seized everything and debt remains.'); }
  if(a.id!=='P' && a.loans.length){
    if(a.form==='PT'||a.form==='PTP'){ logm(`${coName(a)} is insolvent. As a PT, its remaining debt of ${rp(debt(a))} stays with the company; your liability is limited.`,'bad'); a.loans=[]; a.cash=Math.max(0,a.cash); }
    else { const rem=debt(a); S.P.loans.push({id:nid('L'),name:`Debt assumed from ${coName(a)}`,prod:'KTA',P:rem,bal:rem,r:ktaRate(S.h),n:24,left:24,pay:annuity(rem,ktaRate(S.h),24),due:addMonths(S.h,1),miss:0}); a.loans=[]; logm(`${coName(a)} is a ${a.form}: you are personally liable. ${rp(rem)} of its debt moves to you.`,'bad'); }
  }
  S.dirty=true;
}

/* ---------- market orders */
function placeOrder(aid,sym,side,lots){
  if(!listed(sym,S.h)) return `${sym} (${STK[sym].n}) only lists on the exchange on ${fkey(STK[sym].ipo)}.`;
  if(!(lots>0)) return 'Enter a number of lots.';
  if(isOpen(S.h)) return execOrder(aid,sym,side,lots);
  S.orders.push({id:nid('O'),a:aid,s:sym,side,lots,h:S.h});
  logm(`${acctName(aid)}: ${side==='buy'?'buy':'sell'} order for ${lots} lot ${sym} queued for the next session.`);
  return null;
}
function execOrder(aid,sym,side,lots){
  const a=acct(aid); if(!a) return 'Account no longer exists.';
  const px=quote(sym,S.h), sh=lots*lotSize(S.h), gross=sh*px;
  if(side==='buy'){
    const fee=gross*0.0015, cost=gross+fee;
    if(a.cash<cost) return `Not enough in the account: need ${rp(cost)}, ${acctName(aid)} has ${rp(a.cash)}.`;
    a.cash-=cost; const hd=a.hold[sym]||(a.hold[sym]={sh:0,cost:0}); hd.sh+=sh; hd.cost+=cost;
    logm(`${acctName(aid)} bought ${lots} lot (${NF.format(sh)} shares) ${sym} at ${NF.format(px)}. Total ${rp(cost)} incl. fees.`);
  } else {
    const hd=a.hold[sym]; let q=sh; if(!hd||hd.sh<=0) return `${acctName(aid)} holds no ${sym}.`;
    if(q>hd.sh) q=hd.sh;
    const g=q*px, fee=g*0.0015, tax=g*0.001, proceeds=g-fee-tax, basis=hd.cost*q/hd.sh, gain=proceeds-basis;
    a.cash+=proceeds; hd.sh-=q; hd.cost-=basis; if(hd.sh<=0) delete a.hold[sym];
    book(a,'other',gain); srcAdd(a,'gain',gain); if(a.id==='P') S.P.realized=(S.P.realized||0)+gain;
    logm(`${acctName(aid)} sold ${NF.format(q)} shares ${sym} at ${NF.format(px)}. Proceeds ${rp(proceeds)} after 0,1% final tax; ${gain>=0?'gain':'loss'} ${rp(Math.abs(gain))}.`, gain>=0?'good':'bad');
  }
  S.dirty=true; return null;
}
function runOrders(){ const os=S.orders; S.orders=[]; for(const o of os){ const err=execOrder(o.a,o.s,o.side,o.lots); if(err) logm(`Queued order failed: ${err}`,'bad'); } S.dirty=true; }

function endGame(why){ S.over=true; S.overWhy=why; S.paused=true; S.final=finalEval(); logm(why,'news'); logm(`Final tally: ${S.final.rank}. Net worth ${rp(S.final.nw)} against ${rp(S.final.b.dep)} had your parents' money sat in deposito.`,'news'); S.dirty=true; save(); }

const momName=id=>'Ibu '+FEM[(parseInt(String(id).slice(1))*7)%FEM.length];
function pickBoard(tmp,key,role){
  if(key==='P') return {who:'P',role,src:'self',skill:0,integ:100,sal:0,mkt:0,since:S.h};
  if(key==='MOM') return {who:'X',role,src:'fam',name:momName(tmp.id),bg:'Your mother, the family shareholder',skill:40,integ:90,sal:0,mkt:0,since:S.h};
  const x=candidates(tmp,role).find(y=>y.key===key); if(!x) return null;
  return {who:'X',role,src:x.src,name:x.name,bg:x.bg,skill:x.skill,integ:x.integ,sal:x.sal,mkt:x.sal,since:S.h,fee:x.fee,key};
}
function foundCompany(o){
  const h=S.h, src=acct(o.owner); if(!src) return 'Choose who owns the company.';
  const name=(o.name||'').trim(); if(!name) return 'Give the company a name.';
  if(S.C.some(x=>x.name.toLowerCase()===name.toLowerCase())) return `You already have a company called ${name}. Pick another name.`;
  if(!REG[o.reg]) return 'Choose the regency where the company is registered.';
  const law=lawPT(h), isPT=o.form==='PT'||o.form==='PTP', short=o.form==='PTP'?'PT Perorangan':FORMS[o.form].short;
  if(o.form==='PTP' && h<H_PTP) return 'PT Perorangan only exists from February 2021 (PP 8/2021).';
  if((o.form==='UD'||o.form==='CV'||o.form==='PTP') && o.owner!=='P') return `A ${short} can only be owned by an individual. Subsidiaries must be regular PTs.`;
  if(o.owner!=='P'){ const par=acct(o.owner); if(!par||par.form!=='PT') return 'Only a regular PT can be a parent company.'; }
  const cap=+o.capital||0; if(cap<=0) return 'Enter the capital you put in.';
  let pct=0, partner=null;
  if(o.form==='CV'){ pct=clamp((+o.pct||0)/100,0.01,0.49); partner='F'; }
  if(o.form==='PT'){ pct=clamp((+o.pct||1)/100,0.01,0.49); partner=o.partner||'F'; if(partner===o.owner) return 'The two founders must be different.'; }
  const total=cap/(1-pct), pcap=total-cap;
  if(o.form==='PT' && total<law.minPaid) return `Paid-up capital must be at least ${rp(law.minPaid,true)} under ${law.law}.`;
  const tmp={id:'C'+S.nid,reg:o.reg,hired:[],level:sizeOf(total,0,h)};
  if(!o.dir) return isPT?`Choose the Direktur Utama. A ${short} cannot be registered without a director (UU 40/2007 Art. 92).`:`Choose who runs the ${short}: you or a hired manager.`;
  if(o.form==='PT'&&!o.kom) return 'Choose a commissioner. A PT needs at least one (UU 40/2007 Art. 108).';
  if(o.form==='PT'&&o.dir==='P'&&o.kom==='P') return 'You cannot be both director and commissioner of the same PT. Pick someone else for one of the two seats.';
  const picks=[[o.dir,'dir'],...(o.form==='PT'?[[o.kom,'kom']]:[])].map(([k,r])=>pickBoard(tmp,k,r));
  if(picks.some(p=>!p)) return 'That candidate is no longer available this month. Pick again.';
  const hf=picks.reduce((s,p)=>s+(p.fee||0),0);
  if(hf>=total) return `The headhunter fees of ${rp(hf)} are more than the company's ${rp(total)} starting capital. Raise the capital, or pick yourself or a relative.`;
  const fee=formFee(o.form,h);
  if(src.cash<cap+fee) return `Not enough capital to open another ${short}. You need ${rp(cap+fee)} (capital ${rp(cap)} + setup fees ${rp(fee)}), but ${o.owner==='P'?'your personal account':coName(src)} holds ${rp(src.cash)}. Lower the capital, or pay yourself a dividend from a company first.`;
  if(partner && partner!=='F'){ const pa=acct(partner); if(!pa||pa.cash<pcap) return `${acctName(partner)} needs ${rp(pcap)} for its ${pc(pct,0)} stake.`; pa.cash-=pcap; }
  src.cash-=cap+fee;
  if(o.owner!=='P') book(src,'opex',fee);
  const shares=Math.max(1,Math.round(total/1000));
  const own={}; own[o.owner]=Math.round(shares*(1-pct)); if(partner) own[partner]=shares-own[o.owner];
  const c=Object.assign(newAcct(),{id:nid('C'),name,form:o.form,reg:o.reg,parent:o.owner,own,shares,paidIn:total,retained:0,dir:0,autoUMR:true,units:[],mon:blankPL(),ytd:blankPL(),hist:[],taxDue:0,prevTurnover:null,founded:h});
  c.cash=total-hf; if(hf) book(c,'opex',hf);
  c.board=picks.map(p=>{ const {fee:_f,key:_k,...b}=p; return {...b,id:nid('B')}; });
  c.hired=picks.filter(p=>p.key).map(p=>p.key); c.rups=RUPS_DEF(); c.depts=[]; c.divs=[]; c.pay=PAY_DEF(); c.mfees={}; c.level=tmp.level;
  { const d0=c.board.find(b=>b.role==='dir'); if(d0) d0.fn='ceo'; }
  S.C.push(c); S.sel.co=c.id;
  const how={UD:'registered with SIUP/TDP',CV:'deed signed before a notary and registered',PT:'deed signed before a notary and ratified by the Ministry of Law and Human Rights',PTP:'registered online with a statement of establishment'}[o.form];
  logm(`${coName(c)} founded in ${REG[o.reg].n}, ${provOf(o.reg)}: ${how}. Paid-up capital ${rp(total)}${partner?`, ${acctName(partner)} holds ${pc(pct,0)}`:''}. Setup fees ${rp(fee)}${hf?`, headhunter fees ${rp(hf)}`:''}. ${c.board.map(b=>`${titleOf(c,b)}: ${b.who==='P'?'you':b.name}`).join(' · ')}.`,'good');
  return null;
}
function addUnit(cid,t,reg){
  const c=acct(cid), b=BIZ[t], L=b.lv[0];
  if(!allowed(t,reg)) return `${b.n} is not possible in ${REG[reg].n}. ${whyNot(t)}.`;
  { const g=bizGate(c,t); if(g) return g; }
  const cost=L.setup*cpi(S.h)*landAdj(reg);
  if(c.cash<cost) return `${coName(c)} needs ${rp(cost)} in its account. Inject capital or take a loan first.`;
  c.cash-=cost;
  const u={id:nid('U'),t,reg,lv:0,w:L.staff,sal:Math.round(umr(reg,S.h)*(b.wage||1)/1000)*1000,book:cost,cap:cost,auto:true,ph:'idle',d:0,df:1};
  c.units.push(u);
  const d=km(c.reg,reg);
  logm(`${coName(c)} opened ${b.n} (${L.l}) in ${REG[reg].n} for ${rp(cost)}${isSpec(t,reg)?', a regional specialty':b.kind==='retail'&&retailMult(t,reg)>1.05?', a strong local market':''}. ${d?`${NF.format(d)} km from the office: monitoring ${rp(monCost(c,u))} a month.`:`Monitoring ${rp(monCost(c,u))} a month.`}`,'good');
  if(b.kind==='cycle') tryStart(c,u);
  return null;
}
function upgradeCost(u){ const b=BIZ[u.t]; if(u.lv>=b.lv.length-1) return null; return (b.lv[u.lv+1].setup-b.lv[u.lv].setup)*cpi(S.h)*landAdj(u.reg); }
function companyOwners(c){ return Object.entries(c.own).filter(([,v])=>v>0).map(([k,v])=>({k,pct:v/c.shares})); }
function distributable(c){
  if(c.form==='UD') return Math.max(0,c.cash);
  if(c.form==='CV') return Math.max(0,Math.min(c.cash,c.retained));
  return Math.max(0,Math.min(c.cash,c.retained-(c.reserve||0)));
}
function payDividend(c,amt){
  const max=distributable(c); if(!(amt>0)) return 'Enter an amount.';
  if(amt>max+1) return `At most ${rp(max)} can be distributed right now.`;
  c.cash-=amt; c.retained-=amt;
  if(c.form==='UD'){ S.P.cash+=amt; srcAdd(S.P,'div:'+c.id,amt); logm(`Prive: you withdrew ${rp(amt)} from ${coName(c)}.`); return null; }
  const parts=[];
  for(const {k,pct} of companyOwners(c)){
    const g=amt*pct; let rate=0;
    if(c.form!=='CV') rate = (k==='P'||k==='F')?divTaxIndiv(S.h):divTaxCorp(S.h,pct);
    const net=g*(1-rate);
    if(k==='P'){ S.P.cash+=net; srcAdd(S.P,'div:'+c.id,net); } else if(k!=='F'){ const r=acct(k); if(r){ r.cash+=net; book(r,'other',net); srcAdd(r,'div:'+c.id,net); } }
    parts.push(`${acctName(k)} ${rp(net)}${rate?` (after ${pc(rate,0)} tax)`:''}`);
  }
  logm(`${coName(c)} ${c.form==='CV'?'distributed profit':'paid a dividend'} of ${rp(amt)}: ${parts.join(', ')}.`,'good');
  return null;
}
function injectCapital(c,from,amt){
  const src=acct(from); if(!(amt>0)) return 'Enter an amount.'; if(!src||src.cash<amt) return `${acctName(from)} does not have ${rp(amt)} in its account.`;
  const bvps=Math.max(100,equity(c)/c.shares);
  src.cash-=amt; c.cash+=amt; c.paidIn+=amt;
  const ns=Math.round(amt/bvps); c.shares+=ns; c.own[from]=(c.own[from]||0)+ns;
  logm(`${acctName(from)} injected ${rp(amt)} into ${coName(c)} for ${NF.format(ns)} new shares. Your stake is now ${pc(ownPct(c,'P'),1)}.`);
  return null;
}
function dissolve(c){
  if(S.C.some(s=>s.own[c.id])) return 'Dissolve or sell its subsidiaries first.';
  for(const u of c.units) c.cash+=u.book*0.5; c.units=[];
  for(const d of c.deps) c.cash+=d.amt; c.deps=[];
  for(const s in c.hold) c.cash+=c.hold[s].sh*quote(s,S.h)*0.9975; c.hold={};
  for(const b of c.bonds||[]) c.cash+=b.face*bondPx(b)*0.998; c.bonds=[];
  for(const l of c.loans) c.cash-=l.bal; c.loans=[];
  c.cash-=c.taxDue||0; c.taxDue=0;
  const left=c.cash;
  if(left>0){
    for(const {k,pct} of companyOwners(c)){ const g=left*pct, gain=Math.max(0,g-c.paidIn*pct); const rate=(c.form==='PT'||c.form==='PTP')?((k==='P'||k==='F')?divTaxIndiv(S.h):divTaxCorp(S.h,pct)):0; const net=g-gain*rate; if(k==='P') S.P.cash+=net; else if(k!=='F'){ const r=acct(k); if(r) r.cash+=net; } }
  } else if(left<0){
    if(c.form==='UD'||c.form==='CV'){ S.P.cash+=left; logm(`As owner of a ${c.form} you cover its shortfall of ${rp(-left)} personally.`,'bad'); }
  }
  S.C.splice(S.C.indexOf(c),1);
  logm(`${coName(c)} dissolved. ${left>=0?`Liquidation surplus ${rp(left)} returned to shareholders.`:''}`);
  if(S.sel.co===c.id) S.sel.co=S.C[0]?.id||null;
  return null;
}
function loanLimit(a,prod){
  const d=debt(a);
  if(prod==='KTA') return Math.max(0,0.3*(liquid(S.P)+stakesP())-d);
  if(prod==='KMK') return Math.max(0,0.5*(Math.max(0,a.cash)+depSum(a)+holdMV(a)+unitBook(a))+3*avgRev3(a)-d);
  if(prod==='KUR'){ const t=kurTerms(S.h); if(!t) return 0; const kd=a.loans.filter(l=>l.prod==='KUR').reduce((s,l)=>s+l.bal,0); return Math.max(0,Math.min(t.kecilMax-kd, 0.6*unitBook(a)+6*avgRev3(a)+20e6)); }
  return 0;
}
function loanRate(prod,amt,a){ if(prod==='KTA') return ktaRate(S.h); const disc=a&&a.id!=='P'?0.015*fnScore(a,'fin')/100:0; if(prod==='KMK') return kmkRate(S.h)-disc; const t=kurTerms(S.h); return (amt<=t.mikroMax?t.mikroRate:t.kecilRate)-disc; }
function loanCheck(a,prod,amt){
  if(kol(a)>=3) return `Rejected: credit status is ${KOL[kol(a)]}. Clear arrears first.`;
  if(prod==='KUR'){
    if(!kurTerms(S.h)) return 'KUR does not exist yet. It launches on 5 November 2007.';
    if(S.h-a.founded<180*24) return 'KUR needs a business that has run for at least 6 months.';
    if(avgRev3(a)*12>2.5e9) return 'KUR is for micro and small businesses (turnover up to Rp 2,5 M a year).';
    if(!a.units.length) return 'KUR needs an operating business unit.';
  }
  if(prod==='KMK'){ if(!a.units.length) return 'Working-capital credit needs an operating business.'; if(S.h-a.founded<90*24) return 'Banks want at least 3 months of operating history for KMK.'; }
  const lim=loanLimit(a,prod); if(amt>lim) return `Above your limit of ${rp(lim)}.`;
  return null;
}
function takeLoan(aid,prod,amt,n){
  const a=acct(aid); if(!(amt>0)) return 'Enter an amount.';
  const err=loanCheck(a,prod,amt); if(err) return err;
  const r=loanRate(prod,amt,a), pay=annuity(amt,r,n);
  const nm={KTA:'KTA personal loan',KMK:'Kredit Modal Kerja',KUR:amt<=kurTerms(S.h)?.mikroMax?'KUR Mikro':'KUR Kecil'}[prod];
  const prov=amt*0.01; a.cash+=amt-prov; book(a,'intx',prov);
  a.loans.push({id:nid('L'),name:nm,prod,P:amt,bal:amt,r,n,left:n,pay,due:addMonths(S.h,1),miss:0});
  logm(`${acctName(aid)} took a ${nm} of ${rp(amt)} at ${pc(r)} for ${n} months. Instalment ${rp(pay)}/month (1% provision fee).`);
  return null;
}

function coTable(){
  if(!S.C.length) return '<p class="note">No companies.</p>';
  const rows=orderedCos().map(({c,depth})=>{ const e=equity(c), last=c.hist[c.hist.length-1];
    return `<tr class="click" data-act="openco" data-id="${c.id}"><td style="padding-left:${8+depth*18}px">${depth?'↳ ':''}<b>${esc(coName(c))}</b><div class="muted" style="font-size:.78rem">${esc(REG[c.reg].n)} · ${c.units.map(u=>BIZ[u.t].n).join(', ')||'no business units'}</div></td>
      <td class="n">${pc(ownPct(c,'P')+(c.parent!=='P'?0:0),1)}</td><td class="n">${rp(c.cash)}</td><td class="n">${rp(e)}</td><td class="n ${last?cls(last.net):''}">${last?rp(last.net):'—'}</td></tr>`; }).join('');
  return `<div class="tbl-wrap"><table><thead><tr><th>Company</th><th class="n">Your direct stake</th><th class="n">Cash</th><th class="n">Equity</th><th class="n">Last month net</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function orderedCos(){ const out=[]; const walk=(pid,depth)=>{ for(const c of S.C) if(c.parent===pid){ out.push({c,depth}); walk(c.id,depth+1); } }; walk('P',0); for(const c of S.C) if(!out.find(o=>o.c===c)) out.push({c,depth:0}); return out; }
function ledger(n){
  const items=S.log.slice(0,n||S.log.length);
  if(!items.length) return '<p class="note">Nothing yet.</p>';
  return items.map(e=>`<div class="le ${e.k}"><span class="d">${fdate(e.h)}</span><span class="m">${esc(e.m)}</span></div>`).join('');
}

/* ---------- Charts */
function tok(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function setupCanvas(cv){ const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1; if(r.width<10) return null; cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); return {g,w:r.width,h:r.height}; }
function lineChart(cv,pts,fmtY,fmtX){
  const s=setupCanvas(cv); if(!s||pts.length<2) return; const {g,w,h}=s;
  const ink=tok('--ink'), mut=tok('--muted'), rule=tok('--rule'), acc=tok('--accent');
  let lo=Infinity,hi=-Infinity; for(const p of pts){ lo=Math.min(lo,p[1]); hi=Math.max(hi,p[1]); }
  if(hi===lo){ hi+=1; lo-=1; } const pad=(hi-lo)*0.08; lo-=pad; hi+=pad;
  const L0=58,R=10,T=10,B=22, x=i=>L0+(w-L0-R)*(pts[i][0]-pts[0][0])/((pts[pts.length-1][0]-pts[0][0])||1), y=v=>T+(h-T-B)*(1-(v-lo)/(hi-lo));
  g.font='11px '+tok('--f-mono'); g.fillStyle=mut; g.strokeStyle=rule; g.lineWidth=1;
  for(let i=0;i<=3;i++){ const v=lo+(hi-lo)*i/3, yy=Math.round(y(v))+.5; g.beginPath(); g.moveTo(L0,yy); g.lineTo(w-R,yy); g.stroke(); g.textAlign='right'; g.fillText(fmtY(v),L0-6,yy+4); }
  g.textAlign='left'; g.fillText(fmtX(pts[0][0]),L0,h-6); g.textAlign='right'; g.fillText(fmtX(pts[pts.length-1][0]),w-R,h-6);
  g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(x(i),y(p[1])):g.moveTo(x(i),y(p[1]))); g.lineTo(x(pts.length-1),h-B); g.lineTo(x(0),h-B); g.closePath();
  g.globalAlpha=.12; g.fillStyle=acc; g.fill(); g.globalAlpha=1;
  g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(x(i),y(p[1])):g.moveTo(x(i),y(p[1]))); g.strokeStyle=ink; g.lineWidth=1.6; g.stroke();
  const lx=x(pts.length-1), ly=y(pts[pts.length-1][1]); g.beginPath(); g.arc(lx,ly,3.5,0,7); g.fillStyle=acc; g.fill();
}
function barChart(cv,hist){
  const s=setupCanvas(cv); if(!s) return; const {g,w,h}=s;
  const mut=tok('--muted'), rule=tok('--rule'), acc=tok('--accent'), ink=tok('--ink');
  const data=hist.slice(-18); if(!data.length){ g.fillStyle=mut; g.font='12px '+tok('--f-body'); g.fillText('First month still running.',8,20); return; }
  let hi=0,lo=0; for(const d of data){ hi=Math.max(hi,d.rev,d.net); lo=Math.min(lo,d.net); } if(hi===lo) hi=lo+1;
  const L0=50,B=18,T=6, y=v=>T+(h-T-B)*(1-(v-lo)/(hi-lo)), bw=(w-L0-6)/data.length;
  g.font='10px '+tok('--f-mono'); g.fillStyle=mut; g.textAlign='right'; g.strokeStyle=rule;
  [lo,0,hi].forEach(v=>{ const yy=Math.round(y(v))+.5; g.beginPath(); g.moveTo(L0,yy); g.lineTo(w,yy); g.stroke(); g.fillText(rp(v).replace('Rp ',''),L0-4,yy+3); });
  data.forEach((d,i)=>{ g.fillStyle=acc; g.globalAlpha=.55; g.fillRect(L0+i*bw+2,y(d.rev),bw-4,y(0)-y(d.rev)); });
  g.globalAlpha=1; g.beginPath(); data.forEach((d,i)=>{ const xx=L0+i*bw+bw/2; i?g.lineTo(xx,y(d.net)):g.moveTo(xx,y(d.net)); }); g.strokeStyle=ink; g.lineWidth=1.5; g.stroke();
  g.textAlign='left'; g.fillStyle=mut; const f=data[0].k, l=data[data.length-1].k; g.fillText(BLN[f%100-1]+' '+Math.floor(f/100),L0,h-4); g.textAlign='right'; g.fillText(BLN[l%100-1]+' '+Math.floor(l/100),w,h-4);
}
function drawCharts(){
  document.querySelectorAll('canvas[data-chart]').forEach(cv=>{
    const k=cv.dataset.chart;
    if(k==='nw'){ let pts=S.nwh; if(pts.length>600){ const st=Math.ceil(pts.length/600); pts=pts.filter((_,i)=>i%st===0||i===S.nwh.length-1); } pts=pts.concat([[S.h,nwP()]]); lineChart(cv,pts,v=>rp(v).replace('Rp ',''),h=>fdate(h)); }
    else if(k==='y10'){ const last=lastFullIdx(S.h), pts=[]; const step=Math.max(1,Math.floor(last/500)); for(let i=0;i<=last;i+=step) pts.push([hK(TD[i]),MK.Y10[i]]); pts.push([S.h,y10At(S.h)]); lineChart(cv,pts,v=>v.toFixed(1).replace('.',',')+'%',h=>fdate(h)); }
    else if(k==='sym'){ const s=S.sel.sym, last=lastFullIdx(S.h), n={'1M':22,'6M':126,'1Y':250,'5Y':1250,'ALL':99999}[S.sel.range]; const a=Math.max(0,last-n,STK[s]?.ipo?tdLE(STK[s].ipo):0), pts=[]; const step=Math.max(1,Math.floor((last-a)/500)); for(let i=a;i<=last;i+=step) pts.push([hK(TD[i]),MK[s][i]]); pts.push([S.h,quote(s,S.h)]); lineChart(cv,pts,v=>NF.format(Math.round(v)),h=>fdate(h)); }
    else if(k==='map') drawMap(cv);
    else if(k==='pie') drawPie(cv);
    else if(k.startsWith('co:')){ const c=acct(k.slice(3)); if(c) barChart(cv,c.hist.concat(c.mon.rev?[{k:yearOf(S.h)*100+dOf(S.h).getUTCMonth()+1,rev:c.mon.rev,net:netOf(c.mon)}]:[])); }
  });
}

      <div class="fields">

    const keep=()=>{ st.name=body.querySelector('#fm-name').value; st.cap=+body.querySelector('#fm-cap').value||0; const p=body.querySelector('#fm-pct'); if(p) st.pct=+p.value||0; const pa=body.querySelector('#fm-partner'); if(pa) st.partner=pa.value; st.dir=body.querySelector('#fm-dir').value; const k=body.querySelector('#fm-kom'); if(k) st.kom=k.value; };

    body.querySelector('#fm-go').onclick=()=>{
      keep();

}
function unitModal(cid){
  const c=acct(cid); const st={reg:c.reg,p:REG[c.reg].prov,t:null};
  const draw=el=>{
    const r=REG[st.reg], keys=Object.keys(BIZ), ok=keys.filter(t=>allowed(t,st.reg)), free=ok.filter(t=>!bizGate(c,t));
    if(!st.t||!ok.includes(st.t)) st.t=free.find(t=>isSpec(t,st.reg))||free[0]||ok[0];
    const b=BIZ[st.t], Lv=b.lv[0], sp=b.kind==='retail'?retailMult(st.t,st.reg):isSpec(st.t,st.reg)?SPEC_BONUS:1, cost=Lv.setup*cpi(S.h)*landAdj(st.reg), wage=Math.round(umr(st.reg,S.h)*(b.wage||1)/1000)*1000, d=km(c.reg,st.reg), gate=bizGate(c,st.t);
    const GRP=[['Shops & services',t=>!BIZ[t].tier&&BIZ[t].kind==='retail'],['Farming, fishing & plantations',t=>!BIZ[t].tier&&BIZ[t].kind==='cycle'],['Medium businesses · Usaha Kecil and up',t=>BIZ[t].tier===1],['Large businesses · Usaha Menengah and up',t=>BIZ[t].tier===2]];
    const card=k=>{const x=BIZ[k], g=bizGate(c,k), m=x.kind==='retail'?retailMult(k,st.reg):1; return `<button type="button" data-t="${k}" aria-pressed="${k===st.t}" ${g?'style="opacity:.55"':''}><b>${x.n}${isSpec(k,st.reg)||m>1.05?' ★':''}${g?' · locked':''}</b><span>${x.blurb}</span></button>`;};
    const body=el.querySelector('#um-body');
    let econ;
    if(b.kind==='retail'){ const rev=Lv.rev*cpi(S.h)*r.dem*sp*30; econ=`Expected sales about <b>${rp(rev)}</b> a month at ${pc(b.margin,0)} gross margin, rent and utilities ${rp(Lv.opex*cpi(S.h)*r.land)} a month.`; }
    else { const p=commodityPrice(st.t,S.h+b.cycle*24), inp=Lv.input*cpi(S.h)*(b.land?landAdj(st.reg):1), kg=Lv.yield*sp; econ=`Each ${b.cycle}-day cycle costs about <b>${rp(inp)}</b> in inputs and yields around ${NF.format(Math.round(kg))} ${unitOf(b)} of ${b.prod}. At today's price outlook (${rp(p,true)}/${unitOf(b)}${b.usd?`, from about US$ ${NF.format(Math.round(tblAt(USDP[b.usd],S.h)))} on world markets`:''}) that is <b>${rp(kg*p)}</b> before wages. Failure risk ${pc(b.fail,0)} per cycle.`; }
    body.innerHTML=`
      <div class="fields">
        <label class="f">Province<select id="um-prov">${PROVS.map(p=>`<option ${p===st.p?'selected':''}>${esc(p)}</option>`).join('')}</select></label>
        <label class="f">Regency<select id="um-reg">${regsIn(st.p).map(k=>`<option value="${k}" ${k===st.reg?'selected':''}>${esc(REG[k].n)}${k===c.reg?' (office)':''}</option>`).join('')}</select></label>
      </div>
      <p class="note">${esc(TYPE_N[r.type])} · ${d?NF.format(d)+' km from the office in '+esc(REG[c.reg].n):'where the office is'} · UMR ${rp(wage,true)} · specialties: ${specChips(r)}</p>
      ${GRP.map(([lab,f])=>{const ks=ok.filter(f); return ks.length?`<div class="eyebrow">${lab}</div><div class="biz-pick" role="group" aria-label="${lab}">${ks.map(card).join('')}</div>`:'';}).join('')}
      <p class="note">★ marks this regency's specialties and strong local markets. Shops and services open anywhere; how well they sell depends on the regency. ${keys.length-ok.length} resource businesses need farmland or the resource itself; the Regions tab shows where.</p>
      ${gate?`<p class="note warn">${esc(gate)}</p>`:''}
      <div class="rows">
        <div class="row"><span class="k">Setup (${Lv.l})</span><span class="v">${rp(cost)}</span></div>
        <div class="row"><span class="k">Workers needed</span><span class="v">${NF.format(Lv.staff)} × ${rp(wage,true)}${b.wage?` (${String(b.wage).replace('.',',')}× UMR)`:''}</span></div>
        <div class="row"><span class="k">${b.kind==='retail'?'Local demand':'Regional specialty'}</span><span class="v ${sp>1.01?'up':sp<0.99?'down':''}">${b.kind==='retail'?'×'+sp.toFixed(2).replace('.',','):sp>1?'Yes, +25% output':'No'}</span></div>
        <div class="row"><span class="k">Monitoring from ${esc(officeName(c,officeFor(c,st.reg)))}</span><span class="v">${rp(monCostR(c,st.reg))} / month</span></div>
        <div class="row"><span class="k">Expected leakage with this board</span><span class="v ${leakR(c,st.reg)>0.08?'down':''}">${pc(leakR(c,st.reg),1)}</span></div>
        <div class="row"><span class="k">Company account</span><span class="v ${c.cash<cost?'down':''}">${rp(c.cash)}</span></div>
      </div>
      <p class="note">${econ}</p>
      <div class="btns"><button class="btn pri" id="um-go">Open for ${rp(cost)}</button><button class="btn" data-act="close">Cancel</button></div>`;
    body.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>{ st.t=x.dataset.t; draw(el); });
    body.querySelector('#um-prov').onchange=e=>{ st.p=e.target.value; st.reg=regsIn(st.p)[0]; draw(el); };
    body.querySelector('#um-reg').onchange=e=>{ st.reg=e.target.value; draw(el); };
    body.querySelector('#um-go').onclick=()=>{ if(err(addUnit(cid,st.t,st.reg))) return; closeModal(); render(); };
  };
  openModal(`Open a business · ${coName(c)}`,'<div id="um-body" style="display:flex;flex-direction:column;gap:12px"></div>',draw);
}
function menuModal(){
  openModal('Save & game',`
    <p class="note">The game autosaves in this browser every few seconds. To move a save between browsers, copy the save code and paste it on the other side.</p>
    <div class="btns"><button class="btn" id="mm-copy">Copy save code</button><button class="btn" id="mm-load">Load from code below</button><button class="btn" data-act="retire">Retire and see the final tally</button><button class="btn bad" id="mm-new">New game</button></div>
    <textarea id="mm-txt" aria-label="Save code" placeholder="Paste a save code here to load it"></textarea>`,el=>{
    const ta=el.querySelector('#mm-txt');
    el.querySelector('#mm-copy').onclick=()=>{ const s=JSON.stringify(S); ta.value=s; navigator.clipboard?.writeText(s).then(()=>toast('Copied','Save code is on your clipboard.'),()=>{ ta.select(); toast('Select and copy','Clipboard is blocked here; the code is selected in the box.'); }); };
    el.querySelector('#mm-load').onclick=()=>{ try{ const o=JSON.parse(ta.value); if(!o||!o.P||!o.seed) throw 0; S=o; buildMarket(S.seed); migrate(); closeModal(); app.innerHTML=''; render(); toast('Loaded','Save code loaded.'); }catch(e){ toast('Not loaded','That save code could not be read.'); } };
    el.querySelector('#mm-new').onclick=()=>askConfirm('Start a new game? The current game in this browser will be replaced.','Start over',()=>{ S=null; try{localStorage.removeItem(SAVE_KEY);}catch(e){} app.innerHTML=''; render(); });
  });
}

      <span class="stamp">Indonesia · Rupiah</span>
      <h1>Juragan</h1>

      <div style="display:flex;flex-direction:column;gap:8px"><div class="eyebrow">Your name</div><input type="text" id="su-name" maxlength="24" value="${esc(st.name)}" style="max-width:320px"></div>

      <div style="display:flex;flex-direction:column;gap:8px"><div class="eyebrow">Home base</div>
        <select id="su-home" style="max-width:420px">${PROVS.map(p=>`<optgroup label="${esc(p)}">${regsIn(p).map(k=>`<option value="${k}" ${k===st.home?'selected':''}>${esc(REG[k].n)}</option>`).join('')}</optgroup>`).join('')}</select>
        <p class="note">${esc(r.n)}, ${esc(provOf(st.home,h0))} · ${TYPE_N[r.type]} · UMR ${rp(umr(st.home,h0),true)} in ${st.year} · specialties: ${specChips(r)}. This is where you live: it sets your living costs, and you direct companies less well the farther their offices are from home. Each company picks its own office when you found it.</p></div>
      <div style="display:flex;flex-direction:column;gap:8px"><div class="eyebrow">Capital from your parents, in rupiah of ${st.year}</div><div class="opt-row" role="group" aria-label="Seed capital">${caps.map(([v,t])=>`<button type="button" data-c="${v}" aria-pressed="${st.cap===v}"><b>${rp(v)}</b><span>${t} · ≈ ${rp(v/(cpi(h0)))} in 2005 money</span></button>`).join('')}</div></div>
      <label class="check"><input type="checkbox" id="su-liv" ${st.living?'checked':''}> Pay my own living costs (about ${rp(1.5e6*cpi(h0)*(0.55+0.45*umr(st.home,h0)/umr('3171',h0)))} a month in ${esc(r.n)}, rising with inflation)</label>
      <div class="callout">The capital is family money, so there is no one to repay. Grow it into a group of companies, spin off the units that do well, move assets between companies by inbreng and merge what belongs together. When you retire, or history runs out on 31 December 2024, the game tallies your net worth against what the money would have earned in a deposito.</div>
      <div class="btns"><button class="btn pri" id="su-go" style="padding:11px 22px;font-size:1rem">Begin on 3 January ${st.year}</button></div>
      <p class="note">Market data is an approximate reconstruction of IHSG, the 30 IDX30 stocks and Gudang Garam (2005–2024), with later listings opening on their IPO dates. Macro series, minimum wages, commodity prices and company law follow the official history but are simplified for play.</p>
    </div>`;
    const keep=()=>{ st.name=app.querySelector('#su-name').value; };

/* ---------- Events */
const ACT={
  tab:d=>{ closeModal(); S.tab=d.v; render(); window.scrollTo({top:0}); },
  speed:d=>{ const v=+d.v; if(v===0) S.paused=true; else { S.paused=false; S.speed=v; } if(S.over) S.paused=true; syncSpeed(); },
  menu:()=>menuModal(),
  close:()=>closeModal(),
  newgame:()=>{ S=null; try{localStorage.removeItem(SAVE_KEY);}catch(e){} app.innerHTML=''; render(); },
  found:d=>foundModal(d.parent),
  openco:d=>{ S.sel.co=d.id; S.tab='biz'; render(); },
  addunit:d=>unitModal(d.id),
  w:d=>{ const c=acct(d.id), u=c.units.find(x=>x.id===d.u), mx=Math.max(60,2*BIZ[u.t].lv[u.lv].staff); if(u.w<=0&&+d.v<0) return err('There are no workers left to let go.'); const n=Math.max(0,u.w+(+d.v)); if(n>mx) return err(`${mx} workers is the most this unit can use. Expand the unit or open another.`); u.w=n; render(); },
  startcyc:d=>{ const c=acct(d.id), u=c.units.find(x=>x.id===d.u); if(!tryStart(c,u)){ render(); return err(`${coName(c)} needs ${rp(BIZ[u.t].lv[u.lv].input*cpi(S.h)*(BIZ[u.t].land?landAdj(u.reg):1))} in its account to buy inputs for a new cycle; it holds ${rp(c.cash)}.`); } render(); },
  upgrade:d=>{ const c=acct(d.id), u=c.units.find(x=>x.id===d.u), cost=upgradeCost(u); if(c.cash<cost) return err(`Not enough capital to expand. ${coName(c)} needs ${rp(cost)} and holds ${rp(c.cash)}. Inject capital or take a working-capital loan first.`); c.cash-=cost; u.book+=cost; u.cap+=cost; u.lv++; const Lv=BIZ[u.t].lv[u.lv]; logm(`${coName(c)} expanded ${BIZ[u.t].n} in ${REG[u.reg].n} to ${Lv.l} for ${rp(cost)}. It now needs ${Lv.staff} workers.`,'good'); render(); },
  sellunit:d=>{ const c=acct(d.id), u=c.units.find(x=>x.id===d.u); askConfirm(`Sell ${BIZ[u.t].n} (${BIZ[u.t].lv[u.lv].l}) in ${esc(REG[u.reg].n)}? You recover about ${rp(u.book*0.5)}, half its book value. Any crop or stock in progress is lost.`,'Sell',()=>{ c.cash+=u.book*0.5; book(c,'opex',u.book*0.5); c.units.splice(c.units.indexOf(u),1); logm(`${coName(c)} sold ${BIZ[u.t].n} in ${REG[u.reg].n} for ${rp(u.book*0.5)}.`); render(); }); },
  setdir:d=>{ const c=acct(d.id); c.dir=Math.max(0,+document.getElementById('dir-'+c.id).value||0); logm(`${coName(c)} set your pay to ${rp(c.dir,true)} a month.`); render(); },
  dividend:d=>{ const c=acct(d.id); if(err(payDividend(c,+document.getElementById('div-'+c.id).value))) return; render(); },
  inject:d=>{ const c=acct(d.id); if(err(injectCapital(c,document.getElementById('injfrom-'+c.id).value,+document.getElementById('inj-'+c.id).value))) return; render(); },
  dissolve:d=>{ const c=acct(d.id); askConfirm(`Dissolve ${esc(coName(c))}? Business units sell at half book value, loans and taxes are settled, and what is left goes to the shareholders.`,'Dissolve',()=>{ if(err(dissolve(c))) return; render(); }); },
  hire:d=>hireModal(d.id,d.v,d.div),
  cotab:d=>{ S.sel.cotab=d.v; render(); },
  opendiv:d=>divModal(d.id),
  newdept:d=>deptModal(d.id),
  outsrc:d=>outModal(d.id,d.v),
  endout:d=>{ const c=acct(d.id), o=(c.outs||{})[d.v]; if(!o) return; askConfirm(`End the contract with ${esc(o.name)} for ${esc(JOBS[d.v].n.toLowerCase())}? The job is unhandled until a team or another vendor takes it.`,'End contract',()=>{ endOut(c,d.v); render(); }); },
  editdept:d=>deptModal(d.id,d.v),

/* ---------- Loop & persistence */
function save(){ if(!S) return; try{ localStorage.setItem(SAVE_KEY,JSON.stringify(S)); }catch(e){} }
let last=performance.now(), acc=0, lastLive=0, lastChart=0, lastSave=0;
function frame(t){
  const dt=Math.min(1000,t-last); last=t;
  if(S && !S.paused && !S.over){
    acc+=dt/1000*S.speed; let n=Math.floor(acc); acc-=n; n=Math.min(n,400);
    for(let i=0;i<n && !S.over;i++) step();
    if(S.over) render();
  }
  if(S && document.getElementById('main')){
    const focus=document.activeElement, typing=focus&&/INPUT|SELECT|TEXTAREA/.test(focus.tagName)&&focus.type!=='range'&&document.getElementById('main').contains(focus);
    if(S.dirty && !typing && !document.getElementById('scrim')) render();
    if(t-lastLive>200){ liveTick(); lastLive=t; }
    if(t-lastChart>1000){ if(!S.paused) drawCharts(); lastChart=t; }
    if(t-lastSave>5000){ save(); lastSave=t; }
  }
  requestAnimationFrame(frame);
}
